<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuphead Training App — Attempt Log</title>
<link rel="icon" type="image/png" href="assets/icons/app-logo-small.png">
    <link rel="stylesheet" href="style.css?v=1.4.0">
    <link rel="stylesheet" href="css/autolog.css?v=1.4.0">
    <link rel="stylesheet" href="css/boss-cards.css?v=1.4.0">
    <link rel="stylesheet" href="css/host-bridge.css?v=1.4.0">
<link rel="stylesheet" href="css/app-ui.css?v=1.4.0">
<script src="js/appearance.js?v=1.4.0"></script>
</head>
<body class="compact-mode" data-page="attempt-log">

<script src="js/page-header.js?v=1.4.0"></script>


<main class="attempt-log-page">
    <header class="attempt-log-heading">
        <div><h1><span data-i18n="autolog.title">Attempt Log</span> <span class="all-boss-playtime">| <span data-i18n="autolog.playtime">Playtime</span>: <span id="autolog-total-playtime">—</span></span></h1>
        </div>
    </header>
    <div class="autolog-view-tabs" role="group" data-i18n-aria-label="autolog.actions">
        <button id="back-all-bosses" type="button" data-i18n="autolog.back" hidden>← All bosses</button>
    </div>
    <div id="boss-log-workspace" class="boss-log-workspace">
    <div class="boss-log-content">
    <section id="autolog-list-view">
        <div id="autolog-summary" class="boss-stat-grid"></div>
        <div class="recent-attempt-heading"><h2 class="attempt-section-title" data-i18n="autolog.recent">Recent attempts</h2><button id="clear-all-attempts" class="clear-all-attempts" type="button" data-i18n="autolog.clear-all">Clear all records</button></div>
        <div id="autolog-recent" class="recent-attempt-list"></div>
        <button id="load-more-recent" class="recent-load-more" type="button" aria-controls="autolog-recent" data-i18n="autolog.load-more" hidden>Load more</button>
    </section>
    <section id="autolog-detail-view" class="boss-detail-view" hidden></section>
    <section id="overall-progress" class="history-card" hidden>
        <h2 data-i18n="autolog.overall-title">Overall progress</h2>
        <div id="overall-progress-chart"></div>
        <p class="section-note" data-i18n="autolog.overall-method">Each line starts at 0%. Changes are measured from that starting point on the scale of the boss’s average clear time.</p>
    </section>
    </div>
    <nav id="boss-log-sidebar" class="boss-detail-sidebar" data-i18n-aria-label="autolog.boss-list"></nav>
    </div>
</main>
<dialog id="delete-history-dialog" aria-labelledby="delete-history-title">
    <h2 id="delete-history-title" data-i18n="autolog.final-delete">Delete all history</h2>
    <button id="backup-before-clear" class="data-control-btn" type="button" data-i18n="autolog.backup-first">Export a backup first</button>
    <label class="delete-acknowledge"><input id="delete-history-acknowledge" type="checkbox"><span data-i18n="autolog.delete-acknowledge">I understand this removes every clear and death from all categories.</span></label>
    <div class="dialog-actions">
        <button id="cancel-clear" class="data-control-btn" type="button" data-i18n="ui.cancel">Cancel</button>
        <button id="confirm-clear" class="data-control-btn danger-button" type="button" disabled data-i18n="autolog.delete-permanently">Delete permanently</button>
    </div>
</dialog>

<script src="js/sound-effects.js?v=1.4.0"></script>
<script src="data.js?v=1.4.0"></script>
<script src="js/state.js?v=1.4.0"></script>
<script src="js/time.js?v=1.4.0"></script>
<script src="js/ranks.js?v=1.4.0"></script>
<script src="js/data-access.js?v=1.4.0"></script>
<script src="js/category.js?v=1.4.0"></script>
<script src="js/language.js?v=1.4.0"></script>
<script src="js/host-bridge.js?v=1.4.0"></script>
<script src="js/wr-times.js?v=1.4.0"></script>
<script src="js/overall-progress.js?v=1.4.0"></script>
<script src="js/boss-chart.js?v=1.4.0"></script>
<script src="js/boss-card-data.js?v=1.4.0"></script>
<script src="js/boss-cards.js?v=1.4.0"></script>
<script src="js/autolog.js?v=1.4.0"></script>
</body>
</html>
