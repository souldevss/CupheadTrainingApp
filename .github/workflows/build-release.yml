name: Build and release Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Package Windows app
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.Substring(1) } else { '1.0.0-ci.' + $env:GITHUB_RUN_NUMBER }
          ./scripts/Publish.ps1 -Version $version
      - name: Upload build download
        uses: actions/upload-artifact@v4
        with:
          name: CupheadTrainingTable-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -Path artifacts/*.zip, artifacts/*.sha256 | Select-Object -ExpandProperty FullName
          gh release create "$env:GITHUB_REF_NAME" @assets --verify-tag --generate-notes --title "Cuphead Training Table $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }

